name: Integrate verified audit

on:
  push:
    branches: [fix/training-audit-2026-10-03]
    paths: [.github/workflows/integrate-audit.yml]

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact locally verified source edits
        env:
          AUDIT_EDITS: >-
            
            
            
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          payload = lzma.decompress(base64.b64decode(''.join(os.environ['AUDIT_EDITS'].split()), validate=True))
          assert hashlib.sha256(payload).hexdigest() == '03b9cb209e66b1aa66f21d2e21dbea299665c4703e73ab5d96933820d047e853'
          edits = json.loads(payload)
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          changes = []
          for name, spec in edits.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name == 'README.md' or name.startswith(('src/', 'tests/'))
              old = path.read_bytes() if path.exists() else b''
              assert (blob(old) if path.exists() else None) == spec['before'], 'Unexpected base: ' + name
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(spec['edits']):
                  lines[start:end] = [text]
              new = ''.join(lines).encode('utf-8')
              assert blob(new) == spec['after'], 'Unexpected result: ' + name
              changes.append((path, new))
          for path, new in changes:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          print('Applied and hash-verified', len(changes), 'source/test/documentation files.')
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit verified changes to audit branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src tests README.md
          git commit -m 'fix: integrate effort, comparability, migration and conservative planning safeguards'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/training-audit-2026-10-03
