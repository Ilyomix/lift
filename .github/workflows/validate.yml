name: Validate changes

on:
  push:
    branches: [fix/training-audit-2026-10-03]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package source and installed dependencies for local verification
        if: github.event_name == 'push'
        run: |
          git archive HEAD > /tmp/lift-workspace.tar
          tar -rf /tmp/lift-workspace.tar node_modules
          gzip /tmp/lift-workspace.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: lift-workspace
          path: /tmp/lift-workspace.tar.gz
          retention-days: 1
