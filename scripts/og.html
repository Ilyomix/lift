<!doctype html>
<!-- Share image, 1200 × 630. Render with scripts/og.py; bump the image URL in index.html after updates. -->
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Lift — aperçu de partage</title>
<style>
  @font-face { font-family: 'Geologica'; font-weight: 100 900; src: url('../src/assets/fonts/geologica-latin-wght-normal.woff2') format('woff2-variations'); }
  @font-face { font-family: 'DSEG7'; font-style: italic; font-weight: 700; src: url('../src/assets/fonts/DSEG7ClassicMini-BoldItalic.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body { position: relative; overflow: hidden; background: #2e62f5; color: #f4f5f7; font-family: 'Geologica', sans-serif; -webkit-font-smoothing: antialiased; }
  .left { position: absolute; inset: 54px auto 54px 64px; width: 546px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 17px; font-size: 36px; font-weight: 750; letter-spacing: -.035em; }
  .brand img { width: 68px; height: 68px; border-radius: 16px; }
  h1 { margin-top: 31px; font-size: 68px; line-height: 1.015; font-weight: 850; letter-spacing: -.05em; }
  .sub { margin-top: 24px; font-size: 22px; line-height: 1.45; font-weight: 450; letter-spacing: -.02em; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
  .foot span { padding: 11px 16px; border: 1px solid #ffffff55; border-radius: 999px; }
  .card { position: absolute; top: 54px; right: 64px; width: 432px; height: 522px; padding: 30px; background: #060a13; border: 1px solid #1f2734; border-radius: 28px; box-shadow: 0 22px 44px #06277b55; }
  .eyebrow { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; }
  .eyebrow span:last-child { color: #a3aec4; font-size: 14px; }
  .dial { position: relative; width: 300px; height: 300px; margin: 25px auto 0; }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .clock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .digits { position: relative; font-family: 'DSEG7'; font-style: italic; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 55px; line-height: 1; color: #e6ebf5; }
  .digits::before { position: absolute; inset: 0; content: '88:88'; opacity: .08; }
  .total { position: absolute; top: calc(50% + 44px); width: 100%; text-align: center; font-size: 15px; color: #a3aec4; }
  .next { text-align: center; margin-top: 24px; }
  .next p { font-size: 14px; color: #a3aec4; }
  .next strong { display: block; margin-top: 7px; font-size: 23px; letter-spacing: -.025em; font-weight: 650; }
  .next .sets { margin-top: 7px; font-size: 16px; }
</style>
</head>
<body>
  <section class="left">
    <div class="brand"><img src="../public/icons/app-icon-1024.png" alt="" />Lift</div>
    <h1>CHAQUE<br />SÉANCE<br />COMPTE.</h1>
    <p class="sub">Ton programme de musculation.<br />Des exercices en 3D. Des progrès suivis.</p>
    <div class="foot"><span>Salle ou maison</span><span>Sans compte</span><span>Hors ligne</span></div>
  </section>
  <aside class="card" aria-label="Minuteur de repos Lift">
    <div class="eyebrow"><span>Repos</span><span>Séance Pull</span></div>
    <div class="dial">
      <svg viewBox="0 0 300 300" id="ticks" aria-hidden="true"></svg>
      <div class="clock"><span class="digits">01:30</span></div>
      <span class="total">sur 02:30</span>
    </div>
    <div class="next"><p>Ensuite</p><strong>Tirage vertical</strong><p class="sets">Série 2 sur 3 · 6–10 reps</p></div>
  </aside>
  <script>
    // Same 180-mark bezel and three tick lengths as RestTimer.tsx.
    const ticks = document.getElementById('ticks')
    for (let i = 0; i < 180; i++) {
      const long = i % 15 === 0, mid = !long && i % 3 === 0, on = i < 108
      const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line')
      const attrs = { x1: 150, x2: 150, y1: 4, y2: long ? 24 : mid ? 15 : 10, 'stroke-width': long ? 3 : mid ? 1.75 : 1,
        stroke: on ? '#3068f5' : '#3c4351', opacity: on ? long ? 1 : mid ? .85 : .6 : .5, 'stroke-linecap': 'round', transform: `rotate(${i * 2} 150 150)` }
      for (const [key, value] of Object.entries(attrs)) tick.setAttribute(key, String(value))
      ticks.appendChild(tick)
    }
  </script>
</body>
</html>
