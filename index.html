<!doctype html>
<html lang="fr" data-theme="dark" data-accent="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lift</title>
    <meta name="description" content="Programme d'hypertrophie fondé sur la recherche : séances, calendrier des blocs, minuteur de repos et suivi des objectifs." />
    <meta name="theme-color" content="#060A13" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lift" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the stored theme and accent before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('golgoth-theme')
        var a = localStorage.getItem('golgoth-accent')
        var root = document.documentElement
        if (t === 'light' || t === 'dark' || t === 'auto') root.setAttribute('data-theme', t)
        if (a === 'orange' || a === 'blue') root.setAttribute('data-accent', a)
        var dark = t !== 'light' && (t !== 'auto' || matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#060A13' : '#F9FAFD')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Lift a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
